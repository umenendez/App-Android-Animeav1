<!DOCTYPE html>
<html lang="es" data-tema="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>AnimeAV1 Tracker</title>
  <script src="theme.js"></script>
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f5f8, #0e131b);
      --surface: light-dark(#ffffff, #171d29);
      --field: light-dark(#eef0f4, #202837);
      --border: light-dark(#e1e4ea, #2a3345);
      --text: light-dark(#141824, #e8ebf2);
      --muted: light-dark(#667085, #8b95a7);
      --accent: light-dark(#dc2626, #f05252);
      --c-viendo: light-dark(#c2410c, #fb923c);
      --c-visto: light-dark(#15803d, #4ade80);
      --c-sin: light-dark(#b91c1c, #f87171);
      --c-drop: light-dark(#9f1239, #f472b6);
      --c-por: light-dark(#7e22ce, #c084fc);
      --st: var(--muted);
      --tinte: var(--surface);
    }
    :root[data-tema="light"] { color-scheme: light; }
    :root[data-tema="dark"] { color-scheme: dark; }

    [data-estado="-"]  { --st: var(--c-viendo); --tinte: #f97316; }
    [data-estado="✔"]  { --st: var(--c-visto);  --tinte: #22c55e; }
    [data-estado="✖"]  { --st: var(--c-sin);    --tinte: #ef4444; }
    [data-estado="📉"] { --st: var(--c-drop);   --tinte: #9f1239; }
    [data-estado="@"]  { --st: var(--c-por);    --tinte: #9333ea; }

    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 12px 12px 0;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* Cabecera */
    .cabecera { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .logo { width: 24px; height: 24px; border-radius: 50%; }
    h1 { font-size: 15px; font-weight: 700; margin: 0; }
    #contador { font-size: 12px; color: var(--muted); }
    .acciones { margin-left: auto; display: flex; gap: 2px; }
    .icon-btn {
      width: 30px; height: 30px; padding: 0;
      display: grid; place-items: center;
      border: none; border-radius: 8px;
      background: transparent; color: var(--muted);
    }
    .icon-btn:hover { background: var(--field); color: var(--text); }
    .icon-btn[aria-pressed="true"], .icon-btn[aria-expanded="true"] {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
    }
    .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #btnTema svg { display: none; }
    #btnTema[data-modo="auto"] .i-auto, #btnTema[data-modo="light"] .i-light, #btnTema[data-modo="dark"] .i-dark { display: block; }

    /* Filtros */
    .filtros { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .fila { display: flex; flex-wrap: wrap; gap: 5px; }
    .fila > * { flex: 1 1 100px; min-width: 0; }
    .fila > #busqueda { flex: 1.6 1 120px; }
    #busqueda, .filtros select {
      height: 28px; padding: 0 8px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface);
    }
    #busqueda::placeholder { color: var(--muted); }
    select {
      appearance: none; -webkit-appearance: none; cursor: pointer;
      padding-right: 20px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%239ca3af' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat; background-position: right 7px center;
    }
    /* Una sola fila con scroll horizontal en vez de envolver en varias líneas */
    .chips {
      display: flex; flex-wrap: nowrap; gap: 5px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding-bottom: 1px;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      font-size: 11.5px; font-weight: 500;
    }
    .chip:hover { border-color: var(--muted); }
    .chip .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--st); }
    .chip .n { color: var(--muted); font-size: 11px; }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
    .chip[aria-pressed="true"][data-estado] {
      background: color-mix(in srgb, var(--st) 16%, var(--surface));
      color: var(--st); border-color: var(--st);
    }

    /* Estados vacío / carga / error */
    .aviso { text-align: center; color: var(--muted); padding: 40px 12px; }
    .aviso button { margin-top: 10px; }
    #error { color: var(--accent); }
    .spinner {
      width: 22px; height: 22px; margin: 0 auto 10px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: gira .8s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
    .btn {
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .btn:hover:not(:disabled) { border-color: var(--muted); }
    .btn:disabled { opacity: .55; cursor: default; }

    /* Lista y tarjetas */
    #lista {
      flex: 1; min-height: 0; overflow-y: auto;
      display: grid; grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: min-content; align-content: start; gap: 7px;
      padding-bottom: 12px; scrollbar-width: thin;
    }
    @media (min-width: 480px) { #lista { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 620px) { #lista { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 860px) { #lista { grid-template-columns: repeat(6, 1fr); } }
    .card {
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      background: color-mix(in srgb, var(--tinte) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--tinte) 40%, var(--border));
      border-radius: 12px;
    }
    .portada { position: relative; aspect-ratio: 2 / 3; background: var(--field); }
    .portada::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--st); }
    .cover { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
    .cover.lista { opacity: 1; }
    .sin-portada { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    .nota {
      position: absolute; top: 5px; left: 5px; width: 34px; height: 19px; padding: 0;
      text-align: center; font-size: 10.5px; font-weight: 700;
      border: none; border-radius: 6px;
      background: rgba(15, 20, 29, .72); color: #fff;
      -moz-appearance: textfield; appearance: textfield;
    }
    .nota::-webkit-inner-spin-button, .nota::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .nota::placeholder { color: rgba(255,255,255,.6); }
    .btn-ultimo-cap {
      display: none; position: absolute; top: 5px; right: 5px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--st); color: #fff; text-decoration: none;
      align-items: center; justify-content: center; font-size: 9px;
    }
    .info { display: flex; flex-direction: column; gap: 4px; padding: 6px; }
    a.titulo {
      color: var(--text); text-decoration: none; font-weight: 650; font-size: 10.5px; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 25px;
    }
    a.titulo:hover { text-decoration: underline; }
    .info select, .info input:not(.nota) {
      width: 100%; height: 23px; padding: 0 6px; font-size: 10.5px;
      border: 1px solid var(--border); border-radius: 6px; background-color: var(--field);
    }
    .info select.estado {
      font-weight: 600; color: var(--st);
      border-color: color-mix(in srgb, var(--st) 45%, var(--border));
      background-color: color-mix(in srgb, var(--st) 12%, var(--surface));
    }
    .info select.genero { color: var(--muted); }
    .saved-flash { box-shadow: 0 0 0 2px #22c55e; }
    .edicion { display: flex; flex-direction: column; gap: 5px; padding-top: 7px; border-top: 1px dashed var(--border); }
    .edicion label { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--muted); }

    /* Herramientas */
    #herramientas {
      flex-shrink: 0; max-height: 45%; overflow-y: auto;
      margin: 0 -12px; padding: 12px; background: var(--surface); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    #herramientas[hidden] { display: none; }
    #herramientas .btn { width: 100%; text-align: left; }
    .estado-txt { min-height: 16px; margin-bottom: 6px; font-size: 11.5px; color: var(--muted); }

    /* Configuración de la hoja */
    .config { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .config h2 { font-size: 13px; margin: 0; }
    .config p { margin: 0; font-size: 11.5px; color: var(--muted); }
    .config input {
      height: 32px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    }
    .config .estado-txt { margin: 0; }
    .config-sep { border-top: 1px solid var(--border); margin: 10px 0 8px; }
    #agregarPanel {
      flex-shrink: 0; margin: 0 -12px; padding: 10px 12px; gap: 6px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    #agregarPanel h2 { font-size: 13px; margin: 0; }
    #agregarPanel p { margin: 0; font-size: 11.5px; color: var(--muted); }
    #bienvenida { padding-top: 24px; }
    #bienvenida .config { max-width: 420px; margin: 0 auto; gap: 8px; }
    #bienvenida h2 { font-size: 16px; }
    #bienvenida p { font-size: 12.5px; }

    #toast {
      position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 8px);
      padding: 7px 14px; border-radius: 999px; font-size: 12px;
      background: var(--text); color: var(--bg);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 2s !important; } }
  </style>
</head>
<body>
  <header class="cabecera">
    <img class="logo" src="icon48.png" alt="" />
    <h1>Mis animes</h1>
    <span id="contador"></span>
    <div class="acciones">
      <button id="btnAgregar" class="icon-btn" aria-expanded="false" title="Añadir anime por enlace" aria-label="Añadir anime por enlace">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btnEdicion" class="icon-btn" aria-pressed="false" title="Modo edición (portada, título, enlaces)" aria-label="Modo edición">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button id="btnTema" class="icon-btn" data-modo="auto" title="Tema: automático" aria-label="Cambiar tema">
        <svg class="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/></svg>
        <svg class="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button id="btnHerramientas" class="icon-btn" aria-expanded="false" title="Herramientas" aria-label="Herramientas">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="filtros">
    <div class="chips" id="chips"></div>
    <div class="fila">
      <input id="busqueda" type="search" placeholder="Buscar por título" aria-label="Buscar por título" />
      <select id="filtroGenero" aria-label="Filtrar por género"></select>
      <select id="orden" aria-label="Ordenar"></select>
    </div>
  </div>

  <section id="agregarPanel" class="config" hidden>
    <h2>Añadir anime por enlace</h2>
    <p>Pega el enlace de la ficha (por ejemplo de animeav1.com) y se rellenan solos el título y la portada.</p>
    <input id="agregarUrl" type="url" placeholder="https://animeav1.com/media/…" aria-label="Enlace del anime a añadir" />
    <button class="btn" id="agregarBtn" type="button">Añadir</button>
    <div class="estado-txt" id="agregarStatus"></div>
  </section>

  <div id="cargando" class="aviso"><div class="spinner"></div>Cargando tu lista…</div>
  <div id="error" class="aviso" hidden></div>
  <div id="vacio" class="aviso" hidden></div>
  <div id="bienvenida" class="aviso" hidden></div>
  <div id="lista"></div>

  <section id="herramientas" hidden>
    <div id="configTools"></div>
    <div class="config-sep"></div>
    <div class="estado-txt" id="contadorPortadas"></div>
    <button class="btn" id="precargarPortadas">Guardar todas las portadas en este dispositivo</button>
    <div class="estado-txt" id="precargarStatus"></div>
    <button class="btn" id="fillCovers">Buscar portadas que faltan (columna J)</button>
    <div class="estado-txt" id="fillStatus"></div>
    <button class="btn" id="migrateFlv">Migrar enlaces de AnimeFLV a AnimeAV1</button>
    <div class="estado-txt" id="migrateStatus"></div>
  </section>

  <div id="toast" role="status"></div>
  <script src="pwa-api.js"></script>
  <script src="popup.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
